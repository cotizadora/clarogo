<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Llamada cortada</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:grid;place-items:center;background:#c00000;color:#fff;font:700 18px/1.4 "Segoe UI",system-ui,sans-serif;text-align:center;cursor:default;user-select:none;transition:opacity .6s}
body.fuera{opacity:0}
.ico{font-size:58px;line-height:1;animation:latido 1s ease-in-out infinite}
h1{margin:8px 0 4px;font-size:40px;letter-spacing:.04em}
p{margin:0;font-weight:600;opacity:.95}
small{display:block;margin-top:10px;font-weight:500;opacity:.8;font-size:13px}
@keyframes latido{50%{transform:scale(1.12)}}
</style>
</head>
<body>
<div>
  <div class="ico">📵</div>
  <h1>LLAMADA CORTADA</h1>
  <p id="sub">El cliente cortó. Tipifica la llamada.</p>
  <small>Mueve el mouse o presiona una tecla para cerrar</small>
</div>
<script src="cortada.js"></script>
</body>
</html>

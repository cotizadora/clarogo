<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ClaroGo! Genesys</title>
<style>
  :root { --red: #e60000; --text: #1f2430; --muted: #5f6673; --border: #e3e6eb; }
  * { box-sizing: border-box; }
  body { margin: 0; width: 320px; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; color: var(--text); background: #fff; }
  header { background: var(--red); color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 8px; }
  header b { font-size: 1.1rem; font-weight: 900; }
  header small { opacity: .85; font-size: .72rem; margin-left: auto; white-space: nowrap; }
  header .ver { background: #fff; color: var(--red); font-weight: 800; font-size: .74rem; padding: 2px 8px; border-radius: 999px; }
  main { padding: 12px 14px 14px; }
  #estado { font-size: .84rem; color: var(--muted); margin: 0 0 10px; }
  #estado.ok { color: #14532d; }
  #estado.mal { color: #8a1010; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: .84rem; }
  td { padding: 5px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
  td:first-child { color: var(--muted); width: 38%; padding-right: 8px; }
  td.tel { font-size: 1.15rem; font-weight: 800; }
  button { width: 100%; border: 0; border-radius: 10px; padding: 10px 12px; font: inherit; font-weight: 700; cursor: pointer; margin-top: 6px; }
  .rojo { background: var(--red); color: #fff; }
  .gris { background: #f1f3f5; color: var(--text); }
  button:disabled { opacity: .5; cursor: default; }
  .verde { background: #25d366; color: #fff; }
  .wa { margin: 12px 0 4px; padding: 10px; border: 1px solid #c8eed6; background: #f1fbf4; border-radius: 10px; }
  .wa label { display: block; font-size: .74rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .wa select { width: 100%; padding: 7px; border: 1px solid var(--border); border-radius: 8px; font: inherit; }
  p.nota { font-size: .72rem; color: var(--muted); margin: 10px 0 0; }
</style>
</head>
<body>
<header><b>ClaroGo!</b><span>Genesys</span><span class="ver" id="version" title="Versión instalada"></span><small title="Herramienta no oficial, no es de Claro Chile">No oficial</small></header>
<main>
  <p id="estado">Buscando la llamada en Genesys…</p>
  <table id="datos" hidden></table>
  <button class="rojo" id="enviar" disabled>➕ Enviar a Mi Planilla (fila nueva)</button>
  <div class="wa" id="wa" hidden>
    <label for="wa-plan">WhatsApp con la oferta</label>
    <select id="wa-plan"></select>
    <button class="verde" id="wa-abrir">WhatsApp Web</button>
  </div>
  <button class="gris" id="copiar" disabled>📋 Copiar de nuevo</button>
  <p class="nota">Los datos ya quedan copiados al abrir esta ventana. En Mi Planilla puedes usar "Pegar desde Genesys" (fila nueva) o el botón naranjo de Genesys en una fila (reemplaza su teléfono). Atajo: Alt+Shift+G.</p>
</main>
<script src="popup.js"></script>
</body>
</html>

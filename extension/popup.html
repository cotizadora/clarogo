<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ClaroGo! Genesys</title>
<style>
  :root { --red: #e60000; --text: #1f2430; --muted: #5f6673; --border: #e3e6eb; }
  * { box-sizing: border-box; }
  html { border: 2px solid #b9bec7; box-shadow: inset 0 0 14px rgba(0,0,0,.18); }
  body { margin: 0; width: 316px; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; color: var(--text); background: #fff; }
  header { background: var(--red); color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 8px; }
  header b { font-size: 1.1rem; font-weight: 900; }
  header small { opacity: .85; font-size: .72rem; margin-left: auto; white-space: nowrap; }
  header .ver { background: #fff; color: var(--red); font-weight: 800; font-size: .74rem; padding: 2px 8px; border-radius: 999px; }
  main { padding: 12px 14px 14px; }
  #estado { font-size: .84rem; color: var(--muted); margin: 0 0 10px; }
  #estado.ok { color: #14532d; }
  #estado.mal { color: #8a1010; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: .84rem; }
  td { padding: 5px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
  td:first-child { color: var(--muted); width: 38%; padding-right: 8px; }
  td.tel { font-size: 1.15rem; font-weight: 800; }
  button { width: 100%; border: 0; border-radius: 10px; padding: 10px 12px; font: inherit; font-weight: 700; cursor: pointer; margin-top: 6px; }
  .rojo { background: var(--red); color: #fff; }
  .gris { background: #f1f3f5; color: var(--text); }
  button:disabled { opacity: .5; cursor: default; }
  .verde { background: #25d366; color: #fff; }
  #comentario { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: .84rem; resize: vertical; margin: 0 0 2px; }
  #rut-cli { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: .9rem; font-weight: 700; margin: 0 0 6px; }
  #rut-cli:focus { outline: 2px solid var(--red); outline-offset: -1px; }
  #comentario:focus { outline: 2px solid var(--red); outline-offset: -1px; }
  .wa { margin: 12px 0 4px; padding: 10px; border: 1px solid #c8eed6; background: #f1fbf4; border-radius: 10px; }
  .wa label { display: block; font-size: .74rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .lam-chk { display: flex !important; align-items: center; gap: 6px; margin: 8px 0 0 !important; font-size: .8rem !important; color: var(--text) !important; font-weight: 700; cursor: pointer; }
  .lam-chk input { margin: 0; width: 16px; height: 16px; }
  .wa select { width: 100%; padding: 7px; border: 1px solid var(--border); border-radius: 8px; font: inherit; }
  .nv { margin: 10px 0 4px; padding: 10px; border: 1px solid #e3e5ea; background: #f7f8fa; border-radius: 10px; }
  .nv label { display: block; font-size: .74rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .nv select, .nv input { width: 100%; padding: 7px; border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: .84rem; margin-bottom: 6px; background: #fff; }
  .nv small { display: block; font-size: .7rem; color: var(--muted); margin-top: 6px; }
  p.nota { font-size: .72rem; color: var(--muted); margin: 10px 0 0; }
</style>
</head>
<body>
<header><b>ClaroGo!</b><span>Genesys</span><span class="ver" id="version" title="Versión instalada"></span><small title="Herramienta no oficial, no es de Claro Chile">No oficial</small></header>
<main>
  <p id="estado">Buscando la llamada en Genesys…</p>
  <table id="datos" hidden></table>
  <input id="rut-cli" maxlength="12" placeholder="RUT del cliente (pregúntaselo y anótalo aquí)" autocomplete="off">
  <textarea id="comentario" rows="2" placeholder="Comentario para la planilla (opcional)"></textarea>
  <button class="rojo" id="enviar" disabled>➕ Enviar a Mi Planilla (fila nueva)</button>
  <div class="wa" id="wa" hidden>
    <label for="wa-plan">WhatsApp con la oferta</label>
    <select id="wa-plan"></select>
    <label class="lam-chk"><input type="checkbox" id="wa-lamina" checked> <span id="wa-lamina-txt">🖼️ Adjuntar la lámina del plan</span></label>
    <button class="verde" id="wa-abrir">WhatsApp Web</button>
  </div>
  <div class="nv" id="nv">
    <label for="nv-motivo">No venta: registro de atención</label>
    <select id="nv-motivo"></select>
    <input id="nv-otro" placeholder="Escribe el motivo" hidden>
    <select id="nv-comp" hidden></select>
    <button class="gris" id="nv-abrir">📝 Abrir el registro de no venta</button>
    <small>Se abre el formulario con el motivo listo. Revísalo, presiona Siguiente y Enviar.</small>
  </div>
</main>
<script src="popup.js"></script>
</body>
</html>

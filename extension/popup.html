<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>GoExt</title>
<style>
  :root { --red: #e60000; --text: #1f2430; --muted: #5f6673; --border: #e3e6eb; }
  * { box-sizing: border-box; }
  html { border: 2px solid #b9bec7; box-shadow: inset 0 0 14px rgba(0,0,0,.18); }
  body { margin: 0; width: 790px; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; color: var(--text); background: #fff; }
  header { background: var(--red); color: #fff; padding: 7px 14px; display: flex; align-items: center; gap: 8px; }
  header b { font-size: 1.1rem; font-weight: 900; }
  header small { opacity: .85; font-size: .72rem; margin-left: auto; white-space: nowrap; }
  #historial { width: auto; margin: 0; padding: 3px 11px; border-radius: 999px; background: #fff; color: var(--red); font-size: .76rem; font-weight: 900; }
  #historial:hover { background: #ffe5e5; }
  #activar { width: auto; margin: 0; padding: 3px 10px; border-radius: 999px; background: #ffd400; color: #1f2430; font-size: .74rem; font-weight: 900; animation: latido 1.2s ease-in-out infinite; }
  @keyframes latido { 50% { transform: scale(1.07); box-shadow: 0 0 0 4px rgba(255,212,0,.35); } }
  header .ver { background: #fff; color: var(--red); font-weight: 800; font-size: .74rem; padding: 2px 8px; border-radius: 999px; }
  main { padding: 10px 12px 12px; display: grid; grid-template-columns: 5fr 6fr; gap: 0 12px; align-items: start; }
  .col { min-width: 0; }
  #estado { font-size: .84rem; color: var(--muted); margin: 0 0 10px; }
  #estado.ok { color: #14532d; }
  #estado.mal { color: #8a1010; }
  #hist { margin: 0 0 6px; padding: 4px 9px; border-radius: 9px; background: #fff4c2; border: 1.5px solid #f0c000; color: #5c4300; font-size: .74rem; font-weight: 700; cursor: help; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #estado.anterior { color: #5c4300; background: #fff4c2; border: 1.5px solid #f0c000; border-radius: 9px; padding: 4px 9px; font-weight: 700; font-size: .78rem; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 8px; font-size: .84rem; }
  td { padding: 3px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
  td:first-child { color: var(--muted); width: 38%; padding-right: 8px; }
  td.tel { font-size: 1.15rem; font-weight: 800; }
  button { width: 100%; border: 0; border-radius: 10px; padding: 8px 10px; font: inherit; font-weight: 700; cursor: pointer; margin-top: 6px; }
  .rojo { background: var(--red); color: #fff; }
  .gris { background: #f1f3f5; color: var(--text); }
  button:disabled { opacity: .5; cursor: default; }
  .verde { background: #25d366; color: #fff; }
  #comentario { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: .84rem; resize: vertical; margin: 0 0 2px; }
  #rut-cli { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: .9rem; font-weight: 700; margin: 0 0 6px; }
  #rut-cli:focus { outline: 2px solid var(--red); outline-offset: -1px; }
  #comentario:focus { outline: 2px solid var(--red); outline-offset: -1px; }
  .wa { margin: 0 0 8px; padding: 9px; border: 1px solid #c8eed6; background: #f1fbf4; border-radius: 10px; }
  .wa label { display: block; font-size: .74rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .lam-chk { display: flex !important; align-items: center; gap: 6px; margin: 8px 0 0 !important; font-size: .8rem !important; color: var(--text) !important; font-weight: 700; cursor: pointer; }
  .lam-chk input { margin: 0; width: 16px; height: 16px; }
  .wa select { width: 100%; padding: 7px; border: 1px solid var(--border); border-radius: 8px; font: inherit; }
  .nv { margin: 0; padding: 9px; border: 1px solid #e3e5ea; background: #f7f8fa; border-radius: 10px; }
  .nv-cab { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
  .nv-cab b { font-size: .8rem; }
  .nv-orden { display: flex; gap: 3px; }
  .nv-orden button { width: auto; margin: 0; padding: 3px 7px; font-size: .68rem; border-radius: 999px; background: #fff; border: 1px solid var(--border); color: var(--muted); }
  .nv-orden button.on { background: #1f2430; border-color: #1f2430; color: #fff; }
  .nv-chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin-bottom: 5px; }
  .nv-chips .g-t { grid-column: 1 / -1; font-size: .62rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 1px 0 -2px; }
  .nv-chips button { margin: 0; padding: 3px 6px; min-height: 24px; font-size: .66rem; line-height: 1.15; font-weight: 700; text-align: left; border-radius: 8px; border: 1.5px solid; }
  .nv-chips button.on { box-shadow: 0 0 0 3px #1f2430; }
  .g-seg { background: #e3f6ea; border-color: #6cc795 !important; color: #0d6438; }
  .g-rech { background: #fde4e4; border-color: #ef8e8e !important; color: #8a1010; }
  .g-req { background: #fff1d6; border-color: #eeb35c !important; color: #7a4205; }
  .g-llam { background: #e8eaee; border-color: #b3bac6 !important; color: #374151; }
  .g-otro { background: #ece6ff; border-color: #a98be8 !important; color: #4f2a9e; }
  .nv select, .nv input { width: 100%; padding: 7px; border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: .84rem; margin-bottom: 6px; background: #fff; }
  .gc-l { display: flex; align-items: center; gap: 6px; margin: 0 0 4px; font-size: .74rem; font-weight: 800; color: #c2410c; }
  .gc-l select { flex: 1; min-width: 0; margin: 0 !important; padding: 5px 6px !important; font-size: .74rem !important; border-color: #f3c4a8 !important; background: #fff7f2 !important; }
  .nv-op { display: flex; gap: 12px; flex-wrap: wrap; margin: 2px 0 0; font-size: .74rem; font-weight: 700; }
  .nv-op label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .nv-op input { width: auto; margin: 0; padding: 0; }
  .nv small { display: block; font-size: .7rem; color: var(--muted); margin-top: 6px; }
  p.nota { font-size: .72rem; color: var(--muted); margin: 10px 0 0; }
  .auto-abrir { margin: 0; padding: 8px 14px 10px; border-top: 1px solid #e3e6eb; font-size: .78rem; color: var(--muted); }
  .auto-abrir label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
</style>
</head>
<body>
<header><b>GoExt</b><span class="ver" id="version" title="Versión instalada"></span><button type="button" id="historial" title="Ver todos los clientes: Mi Planilla y tipificaciones">📋 Historial</button><button type="button" id="activar" hidden title="Ya descargaste una versión nueva: presiona para empezar a usarla">⟳ Activar versión nueva</button><small title="Herramienta no oficial, no es de Claro Chile">No oficial</small></header>
<main>
  <div class="col">
  <p id="estado">Buscando la llamada en Genesys…</p>
  <p id="hist" hidden></p>
  <table id="datos" hidden></table>
  <input id="rut-cli" maxlength="12" placeholder="RUT del cliente (pregúntaselo y anótalo aquí)" autocomplete="off">
  <textarea id="comentario" rows="2" placeholder="Comentario para la planilla (opcional)"></textarea>
  <button class="rojo" id="enviar" disabled>➕ Enviar a Mi Planilla (fila nueva)</button>
  <div class="wa" id="wa" hidden>
    <label for="wa-plan">WhatsApp con la oferta</label>
    <select id="wa-plan"></select>
    <label class="lam-chk"><input type="checkbox" id="wa-lamina" checked> <span id="wa-lamina-txt">🖼️ Adjuntar la lámina del plan</span></label>
    <button class="verde" id="wa-abrir">WhatsApp Web</button>
  </div>
  </div>
  <div class="col">
  <div class="nv" id="nv">
    <div class="nv-cab"><b>No venta: motivo</b><span class="nv-orden" id="nv-orden"><button type="button" data-orden="uso">Más usados</button><button type="button" data-orden="az">A-Z</button><button type="button" data-orden="grupo">Por grupo</button></span></div>
    <input type="hidden" id="nv-motivo">
    <div class="nv-chips" id="nv-chips"></div>
    <input id="nv-otro" placeholder="Escribe el motivo" hidden>
    <select id="nv-comp" hidden></select>
    <label class="gc-l" title="Código de conclusión que se marca en Genesys (no se envía: lo envías tú en Genesys)">Genesys: <select id="gc-codigo"></select></label>
    <div class="nv-op"><label><input type="checkbox" id="nv-auto" checked> Enviar automáticamente</label><label><input type="checkbox" id="nv-aviso" checked> Avisar cuando se envíe</label></div>
    <button class="rojo" id="nv-abrir" title="Abre el formulario de tipificación lleno con este motivo">📝 Abrir el registro de no venta</button>

  </div>
  </div>
</main>
<p class="auto-abrir"><label title="Cuando entra una llamada nueva en Genesys, GoExt se abre sola con los datos del cliente. El ícono y Alt+Shift+G siguen funcionando igual."><input type="checkbox" id="auto-abrir" checked> 📞 Abrir GoExt sola al entrar una llamada</label><label title="Si el cliente corta, aparece al centro una alerta roja 'LLAMADA CORTADA' y GoExt se abre con el motivo Corte de llamado."><input type="checkbox" id="aviso-corte" checked> 📵 Avisar si el cliente corta la llamada</label></p>
<script src="popup.js"></script>
</body>
</html>
